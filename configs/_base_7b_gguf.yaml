# llama.cpp arm of E4. Same model family, same size, same traffic shape as the
# vLLM arm -- and a different quantization format, which is the caveat that
# belongs on every E4 number: GGUF Q4_K_M and AWQ int4 are not the same weights.
# E4 compares *stacks at their native int4*, not one checkpoint on two servers.
#
# Serving flags are deliberately minimal. Each stack runs at its own defaults
# except where the workload forces a choice (slots, KV context, layers on the
# GPU); tuning one arm and not the other would measure the tuning.
#
# The tokenizer is named explicitly because a GGUF path is not an HF repo. It is
# the same tokenizer the vLLM arm uses, so both arms are handed identical token
# sequences by the load generator.
experiment: base
description: Qwen2.5-7B-Instruct GGUF Q4_K_M served by llama.cpp

server:
  stack: llamacpp
  model: Qwen/Qwen2.5-7B-Instruct-GGUF
  gguf_repo: Qwen/Qwen2.5-7B-Instruct-GGUF
  # A two-shard GGUF; llama.cpp is given the first shard and finds the rest.
  gguf_file: qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
  tokenizer: Qwen/Qwen2.5-7B-Instruct
  served_model_name: qwen2.5-7b-instruct-q4_k_m
  n_gpu_layers: 99          # 99 == every layer; nothing left on the CPU
  max_model_len: 4096       # per sequence, matching the vLLM arm
  parallel: 1               # overridden per point; must cover the concurrency
  ctx_size: null            # null => max_model_len * parallel
  cont_batching: true       # llama.cpp's default, and the thing E4 is testing
  flash_attn: auto          # llama.cpp's default
  port: 8000
  extra_args: []
  load_timeout_s: 900

load:
  dataset: random
  input_len: 512
  output_len: 128
  request_rate: inf
  burstiness: 1.0
  num_prompts: 200
  max_concurrency: 1
  seed: 0
  ignore_eos: true
  temperature: 0.0
  extra_args: []

protocol:
  warmup_s: 30
  warmup_prompts: 32
  min_duration_s: 180
  min_requests: 200

slo:
  ttft_p95_s: 1.0
  e2e_p95_s: 10.0
