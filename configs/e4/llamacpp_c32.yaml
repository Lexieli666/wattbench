# E4, llama.cpp arm, concurrency 32. --parallel must match the offered
# concurrency: a request that finds no free slot waits, and llama.cpp reports
# that as a deferred request rather than a preemption. KV context is
# max_model_len x parallel, so each slot gets the same 4096 tokens a vLLM
# sequence gets.
