# M1 harness smoke test. Small model, short run: proves the end-to-end path
# (server -> warmup -> power window -> integrate -> assemble -> sanity) rather
# than measuring anything reportable.
experiment: smoke
point_id: smoke_qwen1_5b_chat_r4
description: harness smoke test, Qwen2.5-1.5B BF16, chat shape, 4 req/s

server:
  model: Qwen/Qwen2.5-1.5B-Instruct
  dtype: bfloat16
  max_model_len: 4096
  gpu_memory_utilization: 0.60
  max_num_seqs: 256
  enable_prefix_caching: false
  port: 8000
  load_timeout_s: 600

load:
  dataset: random
  input_len: 512
  output_len: 128
  request_rate: 4.0
  burstiness: 1.0
  num_prompts: 120
  seed: 0
  ignore_eos: true

protocol:
  warmup_s: 10
  warmup_prompts: 16
  min_duration_s: 25
  min_requests: 100

slo:
  ttft_p95_s: 1.0
  e2e_p95_s: 10.0
