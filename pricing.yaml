      model: meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo
      usd_per_1m_input: 0.02
      usd_per_1m_output: 0.04
      tier: standard
      snapshot_date: "2026-08-09"
      source: "https://deepinfra.com/pricing"
      confidence: primary
      weight_class_comparable: true
    - provider: DeepInfra
      model: Qwen3-14B
      usd_per_1m_input: 0.12
      usd_per_1m_output: 0.24
      tier: standard
      snapshot_date: "2026-08-09"
      source: "https://deepinfra.com/pricing"
      confidence: primary
      weight_class_comparable: true
      note: "Qwen3 generation, not the Qwen2.5 served locally."
    - provider: DeepInfra
