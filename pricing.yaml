# ---------------------------------------------------------------------------
# Third-party latency — context only, never compared against measured TTFT.
# ---------------------------------------------------------------------------
third_party_latency:
  status: not_collected
  note: >
    Plan §1.2 allows a dated snapshot of a public latency tracker for
    qualitative context. Not collected as of 2026-08-09. It is not needed for
    any headline claim: every measured latency number in this repo is
    self-hosted, and no measured-vs-reported latency comparison is made.
    "not run" rather than an estimate.

# ---------------------------------------------------------------------------
# Datacenter reference (plan §0/§1.1) — cited, never plotted as a data point.
# ---------------------------------------------------------------------------
datacenter_reference:
  name: InferenceMAX / InferenceX (SemiAnalysis)
  source: "https://inferencemax.ai/"
  snapshot_date: "2026-08-09"
  confidence: primary
  note: >
    Continuous open-source inference benchmarking on datacenter hardware with
    tokens-per-dollar and tokens-per-watt metrics. Cited in the README as prior
    art and as the origin of the economics vocabulary. No number from it is
    plotted alongside a measured WattBench value.
