# WattBench external data — every number here is REPORTED, NOT MEASURED.
#
# Nothing in this file was produced on the benchmark machine. It is snapshotted
# from public price cards and tariffs so the economics comparison has a dated,
# checkable basis. Any table or plot that consumes a value from this file must
# label it "reported, not measured" (plan §1). Measured values live only in
# results/raw/ and are never blended with these.
#
# snapshot_date is the day the value was read from the cited source. Re-read
# before publishing if the snapshot is more than a few weeks old; API prices in
# particular move fast.

meta:
  snapshot_date: "2026-08-09"
  currency: USD
  policy: >
    Sourced, not measured. Prices are list/public rates without negotiated
    discounts, free tiers, or batch discounts unless a field says otherwise.

# ---------------------------------------------------------------------------
# Electricity — converts measured joules into dollars.
# ---------------------------------------------------------------------------
electricity:
  primary:
    name: LADWP Standard Residential (R-1A)
    usd_per_kwh: 0.277
    snapshot_date: "2026-08-09"
    source: "https://www.ladwp.com/account/customer-service/electric-rates"
    confidence: secondary
    note: >
      LADWP publishes a tiered schedule that varies by tier, zone and season,
      so a single scalar is an approximation. 0.277 is the effective R-1A rate
      as summarised by third-party rate trackers in 2026 (reported range
      0.24-0.28/kWh across tiers and zones); it was NOT read off a bill.
      Because $/1M tokens is linear in this number, analyze.py reports the
      whole plausible band rather than a single line wherever it matters.
  sensitivity_band_usd_per_kwh: [0.24, 0.33]
  alternates:
    - name: LADWP Time-of-Use Residential (R-1B), off-peak
      usd_per_kwh: 0.244
      snapshot_date: "2026-08-09"
      confidence: secondary
    - name: LADWP Time-of-Use Residential (R-1B), peak
      usd_per_kwh: 0.330
      snapshot_date: "2026-08-09"
      confidence: secondary

# ---------------------------------------------------------------------------
# Hardware — the amortised half of the owned-hardware cost model.
# ---------------------------------------------------------------------------
hardware:
  gpu:
    model: NVIDIA GeForce RTX 4090 (24GB)
    launch_msrp_usd: 1599
    street_price_usd: 2100
    street_price_band_usd: [1850, 3200]
    snapshot_date: "2026-08-09"
    confidence: secondary
    source: "public retail/used listing trackers (Amazon, Newegg, eBay aggregators)"
    note: >
      The 4090 is discontinued, so 2026 street prices sit well above the 2022
      MSRP and vary by a factor of ~2 between reference and premium SKUs.
      street_price_usd is the low-to-mid reference-card figure; the band is
      carried through the break-even chart because the answer is sensitive to
      it. This card was already owned, so no purchase was made for this project.
  amortization_years: 3
  amortization_note: >
    Card only. The rest of the host (CPU, RAM, PSU, chassis) is deliberately
    excluded and the exclusion is stated wherever the owned-hardware line
    appears -- a full-system amortisation would raise the owned line and push
    break-even volumes up.
  # Host draw is not included in J/token: power_log.py measures the GPU rail
  # only (nvidia-smi power.draw). The README states this scope explicitly.
  host_overhead_measured: false

# ---------------------------------------------------------------------------
# Rental — the "hypothetical rental" self-host variant (plan §1.3).
# ---------------------------------------------------------------------------
rental:
  note: >
    Rental rates already bundle electricity, so the rental line must NOT also
    add the measured energy cost. analyze.py enforces this.
  options:
    - provider: RunPod
      sku: RTX 4090 (24GB), Community Cloud
      usd_per_hour: 0.34
      snapshot_date: "2026-08-09"
      source: "https://www.runpod.io/gpu-models/rtx-4090"
      confidence: primary
    - provider: RunPod
      sku: RTX 4090 (24GB), Secure Cloud
      usd_per_hour: 0.69
      snapshot_date: "2026-08-09"
      source: "https://www.runpod.io/gpu-models/rtx-4090"
      confidence: primary

# ---------------------------------------------------------------------------
# API list prices, per million tokens.
#
# CAPABILITY WARNING: these are price cards for models that are not equivalent
# to a local Qwen2.5-7B/14B. Frontier rows are included to show the price
# ceiling, not to claim substitutability. The only capability evidence in this
# project is the E2 GSM8K exact-match guard, and it scopes claims to that task
# alone. Open-weight rows are the closest to a like-for-like comparison because
# they serve the same weight class this benchmark runs locally.
# ---------------------------------------------------------------------------
api_prices:
  open_weight_hosted:
